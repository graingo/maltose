name: 测试

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A pull request validates development branches before merge; the push event
# validates the resulting master commit without running the same dev SHA twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Fall back to the source repository for transient proxy errors, not only 404/410.
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          TZ: Asia/Shanghai
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 1s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Apollo Containers
        run: |
          docker compose -f ".github/workflows/apollo/docker-compose.yml" up -d --build

      - name: Start Nacos Containers
        run: |
          docker compose -f ".github/workflows/nacos/docker-compose.yml" up -d --build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"

      - name: Wait for Apollo to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080; then
              echo "Apollo is up"
              break
            fi
            sleep 2
          done

      - name: Wait for Nacos to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8848/nacos; then
              echo "Nacos is up"
              break
            fi
            sleep 2
          done

      - name: Run unit tests
        env:
          APOLLO_IP: http://localhost:8080
          APOLLO_APP_ID: SampleApp
          APOLLO_CLUSTER: default
          NACOS_IP_ADDR: localhost
          NACOS_PORT: 8848
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ""
          DB_NAME: testdb
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run integration tests
        run: |
          go test -v -race -tags=integration ./database/mredis ./contrib/cache/redis

      # Test each nested module as a consumer of the current checkout. A single
      # go.work would activate every module graph at once, which differs from
      # normal module resolution and can introduce artificial package conflicts.
      - name: Test nested modules against local source
        env:
          APOLLO_IP: http://localhost:8080
          APOLLO_APP_ID: SampleApp
          APOLLO_CLUSTER: default
          NACOS_IP_ADDR: localhost
          NACOS_PORT: 8848
        run: .github/scripts/test-local-modules.sh

      - name: Validate standalone modules
        env:
          APOLLO_IP: http://localhost:8080
          APOLLO_APP_ID: SampleApp
          APOLLO_CLUSTER: default
          NACOS_IP_ADDR: localhost
          NACOS_PORT: 8848
        run: |
          set -euo pipefail
          GOWORK=off go mod tidy -diff
          while IFS= read -r mod_file; do
            module_dir=$(dirname "$mod_file")
            echo "Validating standalone module: ${module_dir}"
            (
              cd "$module_dir"
              if go mod edit -json | jq -e 'any(.Replace[]?; .New.Path | startswith("."))' >/dev/null; then
                echo "::error::${module_dir}/go.mod contains a repository-local replace directive; use go.work for local composition."
                exit 1
              fi
              GOWORK=off go mod tidy -diff
              GOWORK=off go test -v -race -mod=readonly ./...
            )
          done < <(find cmd contrib -name go.mod -print | sort)

      - name: Display and enforce coverage
        run: |
          go tool cover -func=coverage.out
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          if [ -z "$coverage" ]; then
            echo "Unable to determine total test coverage"
            exit 1
          fi
          awk -v coverage="$coverage" 'BEGIN {
            minimum = 75.0
            printf "Total coverage: %.1f%% (minimum: %.1f%%)\n", coverage, minimum
            if (coverage < minimum) exit 1
          }'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop Nacos Containers
        if: always()
        run: |
          docker compose -f ".github/workflows/nacos/docker-compose.yml" down || true

      - name: Stop Apollo Containers
        if: always()
        run: |
          docker compose -f ".github/workflows/apollo/docker-compose.yml" down || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --verbose

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan Go modules
        run: |
          set -euo pipefail
          GOWORK=off go mod tidy -diff
          govulncheck ./...
          while IFS= read -r mod_file; do
            module_dir=$(dirname "$mod_file")
            (
              cd "$module_dir"
              GOWORK=off go mod tidy -diff
              GOWORK=off govulncheck ./...
            )
          done < <(find cmd contrib -name go.mod -print | sort)

  api-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"

      - name: Check public API compatibility
        run: |
          set -euo pipefail
          base_version=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$base_version" ]]; then
            echo "No release tag found; skipping API compatibility check"
            exit 0
          fi

          report_file=$(mktemp)
          trap 'rm -f "$report_file"' EXIT
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260810151157-a8b543ca52da \
            -base="$base_version" | tee "$report_file"

          # gorelease reports incompatible changes but intentionally exits 0
          # for v0 modules. Fail the job when any incompatibility other than
          # the release VERSION constant is present.
          if ! awk '
            /^# [^#]/ { current_package = $0; in_incompatible = 0; next }
            /^## incompatible changes$/ { in_incompatible = 1; next }
            /^## / { in_incompatible = 0 }
            in_incompatible && NF {
              if (current_package == "# github.com/graingo/maltose" &&
                  $0 ~ /^VERSION: value changed from /) {
                next
              }
              print
              found = 1
            }
            END { exit found ? 1 : 0 }
          ' "$report_file"; then
            echo "::error::Public API contains backward-incompatible changes"
            exit 1
          fi
