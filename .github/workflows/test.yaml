name: 测试

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          TZ: Asia/Shanghai
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 1s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Apollo Containers
        run: |
          docker compose -f ".github/workflows/apollo/docker-compose.yml" up -d --build

      - name: Start Nacos Containers
        run: |
          docker compose -f ".github/workflows/nacos/docker-compose.yml" up -d --build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Wait for Apollo to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080; then
              echo "Apollo is up"
              break
            fi
            sleep 2
          done

      - name: Wait for Nacos to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8848/nacos; then
              echo "Nacos is up"
              break
            fi
            sleep 2
          done

      - name: Run unit tests
        env:
          APOLLO_IP: http://localhost:8080
          APOLLO_APP_ID: SampleApp
          APOLLO_CLUSTER: default
          NACOS_IP_ADDR: localhost
          NACOS_PORT: 8848
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: ""
          DB_NAME: testdb
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Run integration tests
        run: |
          go test -v -race -tags=integration ./database/mredis ./contrib/cache/redis

      - name: Run nested module tests
        env:
          APOLLO_IP: http://localhost:8080
          APOLLO_APP_ID: SampleApp
          APOLLO_CLUSTER: default
          NACOS_IP_ADDR: localhost
          NACOS_PORT: 8848
        run: |
          go work init .
          while IFS= read -r mod_file; do
            module_dir=$(dirname "$mod_file")
            go work use "$module_dir"
          done < <(find cmd contrib -name go.mod -print | sort)
          while IFS= read -r mod_file; do
            module_dir=$(dirname "$mod_file")
            (cd "$module_dir" && go test -v -race ./...)
          done < <(find cmd contrib -name go.mod -print | sort)

      - name: Display coverage summary
        run: |
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Stop Nacos Containers
        run: |
          docker compose -f ".github/workflows/nacos/docker-compose.yml" down

      - name: Stop Apollo Containers
        run: |
          docker compose -f ".github/workflows/apollo/docker-compose.yml" down

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --verbose

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan Go modules
        run: |
          govulncheck ./...
          while IFS= read -r mod_file; do
            module_dir=$(dirname "$mod_file")
            (cd "$module_dir" && govulncheck ./...)
          done < <(find cmd contrib -name go.mod -print | sort)

  api-compatibility:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Check public API compatibility
        run: |
          base_version=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [[ -z "$base_version" ]]; then
            echo "No release tag found; skipping API compatibility check"
            exit 0
          fi
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20230725093048-515e97ebf090 -base="$base_version"
